name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages (required before tests)
        run: pnpm -r build

      - name: Run tests
        run: pnpm -r test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        run: pnpm -r build

  publish:
    runs-on: ubuntu-latest
    needs:
      - test
      - build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Detect package version changes
        id: version_changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- packages/*/package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version_changes.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Build packages
        if: steps.version_changes.outputs.changed == 'true'
        run: pnpm -r build

      - name: Publish packages
        if: steps.version_changes.outputs.changed == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            core
            nest
            typeorm
            hono
            express
            fastify
            prisma
            drizzle
            mongoose
            mikro-orm
            react
            svelte
            gen
          )

          for pkg in "${packages[@]}"; do
            if [[ ! -d "packages/$pkg" ]]; then
              echo "Skipping packages/$pkg because it does not exist."
              continue
            fi

            echo "Publishing packages/$pkg"
            (
              cd "packages/$pkg"
              PKG_NAME=$(node -p "require('./package.json').name")
              PKG_VER=$(node -p "require('./package.json').version")
              if npm view "${PKG_NAME}@${PKG_VER}" version &>/dev/null; then
                echo "⏭️  ${PKG_NAME}@${PKG_VER} already published, skipping"
              else
                npm publish --access public
              fi
            )
          done
